<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Document paper with shadow -->
  <g filter="url(#shadow)">
    <rect x="136" y="106" width="240" height="310" rx="20" fill="url(#docGrad)" />
  </g>

  <!-- Laser scanning beam across document -->
  <line x1="116" y1="230" x2="396" y2="230" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <rect x="136" y="222" width="240" height="16" fill="#34d399" opacity="0.25" />

  <!-- Corner target brackets -->
  <path d="M 166 146 L 156 146 A 10 10 0 0 0 146 156 L 146 166" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" />
  <path d="M 346 146 L 356 146 A 10 10 0 0 1 366 156 L 366 166" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" />
  <path d="M 146 356 L 146 366 A 10 10 0 0 0 156 376 L 166 376" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" />
  <path d="M 366 356 L 366 366 A 10 10 0 0 1 356 376 L 346 376" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" />

  <!-- Graduation cap icon on document -->
  <path d="M 256 160 L 320 195 L 256 230 L 192 195 Z" fill="#1e293b" />
  <path d="M 220 216 L 220 248 C 220 262 292 262 292 248 L 292 216" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <path d="M 314 200 L 314 235" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <circle cx="314" cy="238" r="4" fill="#f59e0b" />

  <!-- Document text lines -->
  <rect x="176" y="270" width="160" height="10" rx="5" fill="#94a3b8" />
  <rect x="176" y="296" width="130" height="10" rx="5" fill="#cbd5e1" />
  <rect x="176" y="322" width="145" height="10" rx="5" fill="#cbd5e1" />

  <!-- Iranian University blue stamp -->
  <circle cx="310" cy="345" r="22" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="4,3" />
  <circle cx="310" cy="345" r="15" fill="none" stroke="#2563eb" stroke-width="2" />
</svg>
